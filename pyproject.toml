[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtm"
version = "0.1.0"
description = "Semantic search over religious texts, evaluated against a keyword baseline."
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
